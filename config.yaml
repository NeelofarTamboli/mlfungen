# Project configuration for the K562 splice-site usage project.
#
# Rules for this file:
#   * Only put values here that have been decided or verified.
#   * Anything still unknown is `null` with a TODO; do NOT fill in guesses.
#   * All paths are relative to the repository root.

project:
  name: mlfungen
  course: COMS W4762 Machine Learning for Functional Genomics

# Scope for this stage: K562 only. HepG2 is out of scope.
dataset:
  source: ENCODE
  encode_experiment: ENCSR000AEO
  cell_line: K562
  # Accessions checked against the ENCODE portal and GEO; the BAM pair passed
  # the compatibility checks in docs/encode_inputs.md. Both are GRCh38 /
  # GENCODE V29 alignments from one released pipeline run, paired-end 2x100.
  library:
    type: polyA plus RNA-seq
    strandedness: reverse          # dUTP; read 1 is antisense to the transcript
    layout: paired-end
    read_length_per_mate: 100
  replicates:
    rep1:
      biological_replicate: 1
      encode_library: ENCLB059ZZZ
      geo_sample: GSM2072366
      encode_file_accession: ENCFF864OUS
      md5: c941a6b12cce8d8dd4fd3fd1ff29e492   # as listed by ENCODE
    rep2:
      biological_replicate: 2
      encode_library: ENCLB060ZZZ
      geo_sample: GSM2072367
      encode_file_accession: ENCFF696CSX
      md5: 0222c73b629831008bf0d278529e6ef2   # as listed by ENCODE

reference:
  # Verified against the BAM headers (docs/encode_inputs.md). hg19 BAMs also
  # exist for this experiment; do not mix them in.
  genome_build: GRCh38
  annotation_source: GENCODE
  annotation_version: v29
  # ENCODE file identifiers; the files are not downloaded yet.
  annotation_id: gencode.v29.primary_assembly.annotation_UCSC_names
  genome_fasta_id: GRCh38_no_alt_analysis_set_GCA_000001405.15
  # Where the files will be put (placeholders, relative to the repo root).
  # The FASTA is a plain gzip: extract the contigs you need first
  # (src/validation/stream_fasta.py) or decompress and index it.
  annotation_gtf: data/raw/gencode.v29.primary_assembly.annotation_UCSC_names.gtf.gz
  genome_fasta: data/raw/GRCh38_no_alt_analysis_set_GCA_000001405.15.fasta.gz
  annotation_md5: 7f3e84122de9f5a56ca4a17b0a44a33c   # re-computed, matches ENCODE
  genome_fasta_md5: a08035b6a6e31780e96a34008ff21bd6 # as listed by ENCODE
  contig_naming: chr           # chr1, chr2, ... in BAM, GTF and FASTA

mcsplicer:
  # Settings verified on the small K562 subset; see docs/mcsplicer_notes.md.
  dir: external/McSplicer      # git clone of canzarlab/McSplicer (tested: d6a22c3); git-ignored
  sigcount_binary: sigcount    # not sigcount_pe; identical output on paired data
  read_len: 100                # length of one mate, not the fragment
  bootstraps: 10               # small on purpose; only used for the bootstrap SD
  genes_per_chunk: 100         # McSplicer re-reads its whole .cnt for every gene, so
                               # genes are run in chunks with a trimmed .cnt (same results)
  chromosomes: [chr1, chr2, chr3, chr4, chr5, chr6, chr7, chr8, chr9, chr10, chr11,
                chr12, chr13, chr14, chr15, chr16, chr17, chr18, chr19, chr20, chr21,
                chr22, chrX, chrY]
  # sigcount ignores library strand, so each BAM is split by inferred
  # transcript strand and counted per strand against that strand's genes.
  stranded_preprocessing: true
  strand_rule: read1_reverse_or_read2_forward_is_plus

sequence:
  # Total context lengths (bp) to compare. Same values as SpliceAI's
  # context comparison (80 / 400 / 2k / 10k).
  # TODO: decide and document how the context is placed around the site
  # (e.g. symmetric flanks, whether the length includes the site itself).
  context_lengths: [80, 400, 2000, 10000]

splits:
  # PROVISIONAL. Taken from implementation_plan.md (instructor feedback:
  # SpliceAI/Pangolin test chromosomes). Not re-checked against those papers,
  # and not final until we know how many usable splice sites each chromosome
  # has. Validation chromosomes are not chosen yet.
  test_chromosomes: [chr1, chr3, chr5, chr7, chr9]
  validation_chromosomes: null    # TODO: choose 1-2 chromosomes not in test
  # TODO: decide how to handle chrX, chrY, chrM and unplaced contigs.

labels:
  # First regression task: internal acceptor usage only. McSplicer donor values
  # are near-binary in this release (docs/mcsplicer_notes.md), so donors stay in
  # QC/reporting but not in the regression dataset.
  target_site_type: acceptor
  report_site_types: [acceptor, donor]
  # Not decided yet on purpose; set after looking at the real data. Choose the read-support threshold
  # from training/validation chromosomes only, never from the held-out test chromosomes.
  min_read_support: null
  combine_replicates: null        # TODO: decide after replicate comparison

paths:
  data_raw: data/raw              # downloaded inputs (BAM, FASTA, GTF); never committed
  data_interim: data/interim      # McSplicer intermediate + raw outputs
  data_processed: data/processed  # final site tables, sequences, splits
  figures: figures
  results: results
  external_tools: external        # local clones of McSplicer etc.; never committed
